<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nirman — AI Assistant Test Suite</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            background: rgba(74, 222, 128, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Query Presets */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .preset-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .preset-btn:hover {
            border-color: var(--accent-blue);
            background-color: #3b82f620;
        }

        .preset-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            gap: 0.5rem;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .bubble {
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 0.1rem;
        }

        .message.assistant .bubble {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.1rem;
        }

        .meta-bar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.75rem;
        }

        .intent-badge {
            background: #0284c720;
            color: var(--accent-blue);
            border: 1px solid #0284c7;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }

        .sufficiency-badge {
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 700;
        }

        .sufficiency-HIGH { background: #16653420; color: var(--accent-green); border: 1px solid var(--accent-green); }
        .sufficiency-MEDIUM { background: #854d0e20; color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .sufficiency-NONE, .sufficiency-LOW { background: #991b1b20; color: var(--accent-red); border: 1px solid var(--accent-red); }

        .tools-trace {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 0.75rem;
        }

        /* Citations Drawer */
        .citations-drawer {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .citation-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.4rem;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
        }

        .citation-card .cit-title {
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 0.25rem;
        }

        .citation-card .cit-snippet {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Input Controls */
        .input-bar {
            padding: 1.25rem;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .input-bar input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.85rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            outline: none;
        }

        .input-bar input:focus {
            border-color: var(--accent-blue);
        }

        .input-bar button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .input-bar button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 Project Nirman — Risk & RAG AI Assistant</h1>
        <div class="status-badge">Phase 6 Engine Active</div>
    </header>

    <div class="main-container">
        <!-- Sidebar Presets -->
        <div class="sidebar">
            <h2>Query Test Presets</h2>
            
            <button class="preset-btn" onclick="sendPreset('How many projects are currently high or critical risk?')">
                <div class="preset-tag">Structured Analytics</div>
                How many projects are currently high or critical risk?
            </button>

            <button class="preset-btn" onclick="sendPreset('Give me the current risk status of project 020100044.')">
                <div class="preset-tag">Project Risk Inference</div>
                Give me the current risk status of project 020100044.
            </button>

            <button class="preset-btn" onclick="sendPreset('What did the April 2021 PAIMANA report say about project 020100044?')">
                <div class="preset-tag">Historical RAG</div>
                What did the April 2021 PAIMANA report say about project 020100044?
            </button>

            <button class="preset-btn" onclick="sendPreset('Which states have the highest number of critical projects?')">
                <div class="preset-tag">Analytics</div>
                Which states have the highest number of critical projects?
            </button>

            <button class="preset-btn" onclick="sendPreset('Why is project 020100044 considered risky, and what did the historical reports say about its delays?')">
                <div class="preset-tag">Hybrid Multi-Source</div>
                Why is project 020100044 considered risky, and what did historical reports say?
            </button>

            <button class="preset-btn" onclick="sendPreset('Compare project 020100044 with N04000073.')">
                <div class="preset-tag">Comparative Analysis</div>
                Compare project 020100044 with N04000073.
            </button>

            <button class="preset-btn" onclick="sendPreset('Tell me something about project 999999999 that doesn\'t exist.')">
                <div class="preset-tag">Sufficiency Edge Case</div>
                Tell me something about project 999999999 that doesn't exist.
            </button>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="bubble">
                        Hello! I am <strong>Nirman AI Assistant</strong>. I am connected to the PostgreSQL analytics store, ML Risk Engine v1, and 10 financial years of PAIMANA PDF reports. Ask me anything about monitored infrastructure projects!
                    </div>
                </div>
            </div>

            <div class="input-bar">
                <input type="text" id="userInput" placeholder="Type a project code, question, or query..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send Query</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/api/assistant/chat";
        let sessionId = "ui_session_" + Math.random().toString(36).substring(2, 9);

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendUserMessage(text);
            input.value = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                
                if (!response.ok) {
                    throw new Error(`API HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                appendAssistantMessage(data);
            } catch (err) {
                appendErrorMessage("Failed to connect to backend: " + err.message);
            }
        }

        function sendPreset(text) {
            document.getElementById("userInput").value = text;
            sendMessage();
        }

        function appendUserMessage(text) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "message user";
            div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendAssistantMessage(data) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "message assistant";

            let citationsHtml = "";
            if (data.citations && data.citations.length > 0) {
                citationsHtml = '<div class="citations-drawer">';
                data.citations.forEach(c => {
                    citationsHtml += `
                        <div class="citation-card">
                            <div class="cit-title">[${c.citation_id}] ${escapeHtml(c.title)}</div>
                            ${c.snippet ? `<div class="cit-snippet">"${escapeHtml(c.snippet.substring(0, 180))}..."</div>` : ''}
                        </div>
                    `;
                });
                citationsHtml += '</div>';
            }

            const toolsStr = data.tools_used ? data.tools_used.join(", ") : "none";

            div.innerHTML = `
                <div class="meta-bar">
                    <span class="intent-badge">${data.intent}</span>
                    <span class="sufficiency-badge sufficiency-${data.evidence_sufficiency}">Sufficiency: ${data.evidence_sufficiency}</span>
                    <span class="tools-trace">Tools: [${toolsStr}]</span>
                </div>
                <div class="bubble">${escapeHtml(data.answer)}</div>
                ${citationsHtml}
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendErrorMessage(msg) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "message assistant";
            div.innerHTML = `<div class="bubble" style="background: #991b1b40; border-color: #f87171;">❌ ${escapeHtml(msg)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
